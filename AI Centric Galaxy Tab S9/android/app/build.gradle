plugins { id 'com.android.application' }

android {
    namespace 'com.adamgoodwin.galaxyworkspace'
    compileSdk 36
    defaultConfig {
        applicationId 'com.adamgoodwin.galaxyworkspace'
        manifestPlaceholders = [applicationLabel: 'Galaxy Workspace']
        minSdk 33
        targetSdk 36
        versionCode 5
        versionName '0.4.1'
    }
    buildTypes {
        debug {
            if (providers.gradleProperty('galaxyPreview').orNull == 'true') {
                applicationIdSuffix '.voicepreview'
                versionNameSuffix '-preview'
                manifestPlaceholders = [applicationLabel: 'Galaxy Voice Preview']
            }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'
}
